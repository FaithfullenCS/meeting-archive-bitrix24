interface:
  display_name: "Совещания, переписка и решения"
  short_description: "Совместная аналитика совещаний, чатов и обсуждений задач"
  default_prompt: "Используй $meeting-archive-files для выбранной аналитической задачи: сопоставь разрешённые совещания, переписку и обсуждения задач, свяжи контекст и изменения решений с проверяемыми источниками; сохрани итог и обнови ранее выбранную общую записную книжку. Не повторяй неизменённые разборы."
