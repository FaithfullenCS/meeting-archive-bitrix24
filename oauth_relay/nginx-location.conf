# Include inside the existing HTTPS server after checking /oauth/health locally.
# The relay's PUBLIC_HOST and RELAY_BASE_PATH must match this exact route.
location ^~ /integrations/meeting-archive/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 64k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    access_log off;
    error_log /dev/null;
}
