name: Test and build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      UV_PYTHON_INSTALL_DIR: ${{ github.workspace }}/.work/python
      UV_CACHE_DIR: ${{ github.workspace }}/.work/uv-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Bootstrap only; the packaged runtime is pinned via uv below.
          python-version: '3.12.10'
          architecture: x64
      - name: Create pinned Windows build runtime
        run: |
          python -m pip install uv==0.12.22
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv python install 3.12.15 --no-bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv venv --python 3.12.15 --managed-python .venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip sync --python .venv/Scripts/python.exe --require-hashes requirements-dev.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Static checks and tests
        run: |
          .venv/Scripts/python.exe -m ruff check meeting_archive oauth_relay tests scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe -m pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv/Scripts/python.exe scripts/check_resources.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build standalone Windows app
        run: .venv/Scripts/python.exe -X utf8 scripts/build_windows.py
      - name: Smoke test packaged executable and local server
        run: .venv/Scripts/python.exe -X utf8 scripts/smoke_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingArchive-Windows-x64
          path: |
            dist/MeetingArchive-Windows-x64.zip
            dist/MeetingArchive-Windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MeetingArchive-Windows-x64
          path: release
      - name: Publish versioned Windows build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Meeting Archive $GITHUB_REF_NAME" --generate-notes release/*
