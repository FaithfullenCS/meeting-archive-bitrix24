[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-archive"
version = "0.2.16"
description = "Local Bitrix24 meeting archive with optional offline transcription"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "httpx==0.28.1",
  "pydantic==2.13.5", "python-multipart==0.0.32", "psutil==7.0.0",
  "pystray==0.19.5", "Pillow==12.3.0",
  "starlette==1.7.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-asyncio==0.25.3", "ruff==0.11.0", "pyinstaller==6.22.3", "uv==0.12.22"]

[project.scripts]
meeting-archive = "meeting_archive.launcher:main"

[tool.setuptools.package-data]
meeting_archive = ["static/*", "worker/*", "worker/core/*", "resources/*"]

[tool.setuptools.packages.find]
include = ["meeting_archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
